# =====================================================================
# Development stack: PostgreSQL + Redis (denylist, prepared but unused).
# The service itself is normally run from the IDE against these backends.
# Start with:  docker compose -f docker-compose.dev.yml up -d
# =====================================================================
services:
  postgres:
    image: postgres:17-alpine
    container_name: identity-postgres-dev
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
    ports:
      - "5433:5432"
    volumes:
      - identity_pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: identity-redis-dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  identity_pg_dev:
