[versions]
kotlin = "2.4.0"
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.11.0"
kotlinxDatetime = "0.8.0"
koin = "4.2.2"
exposed = "1.3.0"
postgresql = "42.7.11"
hikari = "7.1.0"
flyway = "12.9.0"
nimbusJoseJwt = "10.9.1"
argon2 = "2.12"
bcrypt = "0.10.2"
simpleJavaMail = "8.12.6"
resend = "v4.15.0"
dotenv = "6.5.1"
kotlinLogging = "8.0.4"
logback = "1.5.35"
logstashEncoder = "9.0"
konform = "0.11.1"
# Test
kotlinTestJunit5 = "2.4.0"
junit = "6.1.0"
mockk = "1.14.11"
testcontainers = "2.0.5"
testcontainersModules = "1.21.4"
kotest = "6.2.1"

[libraries]
# Kotlinx
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }

# Dependency injection
koin-ktor = { module = "io.insert-koin:koin-ktor", version.ref = "koin" }
koin-logger-slf4j = { module = "io.insert-koin:koin-logger-slf4j", version.ref = "koin" }

# Persistence
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-kotlin-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
exposed-json = { module = "org.jetbrains.exposed:exposed-json", version.ref = "exposed" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }

# Security
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbusJoseJwt" }
argon2 = { module = "de.mkammerer:argon2-jvm", version.ref = "argon2" }
bcrypt = { module = "at.favre.lib:bcrypt", version.ref = "bcrypt" }

# Email
simple-java-mail = { module = "org.simplejavamail:simple-java-mail", version.ref = "simpleJavaMail" }
resend = { module = "com.resend:resend-java", version.ref = "resend" }

# Config & logging
dotenv = { module = "io.github.cdimascio:dotenv-kotlin", version.ref = "dotenv" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlinLogging" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logstash-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstashEncoder" }

# Validation
konform = { module = "io.konform:konform", version.ref = "konform" }

# Testing
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlinTestJunit5" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainersModules" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainersModules" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
