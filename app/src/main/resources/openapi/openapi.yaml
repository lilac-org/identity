openapi: 3.0.3
info:
  title: Identity Auth Microservice
  description: >-
    Centralised authentication & authorization service. Issues RS256 JWT access
    tokens (verifiable by any downstream backend via the JWKS endpoint) and
    rotating, reuse-detecting refresh tokens. All responses use the envelope
    `{ success, message, data, error }`.
  version: 1.0.0
servers:
  - url: https://andreasmlbngaol-identity.hf.space
    description: Production (Hugging Face Space)
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Auth
  - name: Account
  - name: OAuth
  - name: Admin
  - name: System

paths:
  /health:
    get:
      tags: [System]
      summary: Liveness/readiness probe
      responses:
        "200": { description: Service is healthy }
  /.well-known/jwks.json:
    get:
      tags: [System]
      summary: JSON Web Key Set for verifying access tokens
      responses:
        "200": { description: The active public signing keys }
  /.well-known/openid-configuration:
    get:
      tags: [System]
      summary: OpenID-style discovery document
      responses:
        "200": { description: Issuer and endpoint metadata }

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new account (email + username + password)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Account created; verification email sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate with identifier (email/username/phone) + password
      description: Cookie transport requires a registered public clientId, an allowed Origin derived from its redirectUris, and X-Requested-With.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Access + refresh tokens issued; cookie mode omits refresh token from JSON
          headers:
            Set-Cookie:
              description: HttpOnly refresh-token cookie when useCookie is true
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate a refresh token
      description: Native clients send refreshToken. Cookie clients send clientId and audience while the browser supplies the cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: New token pair; cookie mode rotates Set-Cookie and omits refresh token from JSON
          headers:
            Set-Cookie:
              description: Rotated HttpOnly refresh-token cookie in cookie mode
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the presented refresh token (or all devices)
      description: Cookie clients send clientId while the browser supplies the refresh token cookie.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogoutRequest" }
      responses:
        "200": { description: Logged out }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password-reset email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "200": { description: Email sent if the account exists }
  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: Complete a password reset with a token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "200": { description: Password updated }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify an email address with a token
      description: >-
        The token may be supplied either as a `token` query parameter or in a
        JSON body `{ "token": "..." }`.
      parameters:
        - name: token
          in: query
          required: false
          schema: { type: string }
          description: Verification token (alternative to the JSON body).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/auth/resend-verification:
    post:
      tags: [Auth]
      summary: Resend the verification email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResendVerificationRequest" }
      responses:
        "200": { description: Email re-sent if applicable }
  /api/v1/auth/token:
    post:
      tags: [Auth]
      summary: Client-credentials grant (service-to-service)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientCredentialsRequest" }
      responses:
        "200":
          description: Service access token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenEnvelope" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/oauth/{provider}:
    get:
      tags: [OAuth]
      summary: Begin an OAuth authorization (google | github)
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, github] }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
      responses:
        "302": { description: Redirect to the provider }
  /api/v1/oauth/{provider}/callback:
    get:
      tags: [OAuth]
      summary: OAuth provider callback
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, github] }
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
      responses:
        "302": { description: Redirect to the registered client with code and state }
  /api/v1/oauth/token:
    post:
      tags: [OAuth]
      summary: Exchange an authorization code with PKCE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthorizationCodeExchangeRequest" }
      responses:
        "200":
          description: Token pair issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenEnvelope" }

  /api/v1/users/me:
    get:
      tags: [Account]
      summary: Get the current user's profile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Account]
      summary: Update the current user's profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/users/me/change-password:
    post:
      tags: [Account]
      summary: Change the current user's password
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "200": { description: Password changed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/admin/users:
    get:
      tags: [Admin]
      summary: List users (requires users:read)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Search"
      responses:
        "200": { description: Paged users }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/admin/users/{id}:
    get:
      tags: [Admin]
      summary: Get a single user (requires users:read)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserEnvelope" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Admin]
      summary: Soft-delete a user (requires users:delete)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200": { description: User deleted }
  /api/v1/admin/users/{id}/suspend:
    post:
      tags: [Admin]
      summary: Suspend a user (requires users:write)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200": { description: User suspended }
  /api/v1/admin/users/{id}/reactivate:
    post:
      tags: [Admin]
      summary: Reactivate a suspended user (requires users:write)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200": { description: User reactivated }
  /api/v1/admin/users/{id}/roles:
    post:
      tags: [Admin]
      summary: Assign a role to a user (requires roles:assign)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignRoleRequest" }
      responses:
        "200": { description: Role assigned }
  /api/v1/admin/users/{id}/roles/{role}:
    delete:
      tags: [Admin]
      summary: Revoke a role from a user (requires roles:assign)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: role
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Role revoked }
  /api/v1/admin/roles:
    get:
      tags: [Admin]
      summary: List roles (requires roles:read)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Roles }
  /api/v1/admin/audit-logs:
    get:
      tags: [Admin]
      summary: Read the audit log (requires audit:read)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200": { description: Paged audit entries }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number.
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      required: false
      description: Page size.
      schema: { type: integer, minimum: 1, default: 20 }
    Search:
      name: search
      in: query
      required: false
      description: Free-text search filter.
      schema: { type: string }
    UserId:
      name: id
      in: path
      required: true
      description: User UUID.
      schema: { type: string, format: uuid }

  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    # ---- Requests -----------------------------------------------------
    RegisterRequest:
      type: object
      required: [email, username, password]
      properties:
        email: { type: string, format: email, example: user@example.com }
        username: { type: string, example: johndoe }
        password: { type: string, format: password, example: Password123! }
        fullName: { type: string, nullable: true, example: John Doe }
        phoneNumber: { type: string, nullable: true, example: "+6281234567890" }
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Email, username, or phone number.
          example: user@example.com
        password: { type: string, format: password, example: Password123! }
        audience:
          type: array
          items: { type: string }
          default: []
          description: Optional target audience(s) for the access token.
        clientId:
          type: string
          nullable: true
          description: Registered public client id; required when useCookie is true.
        useCookie:
          type: boolean
          default: false
          description: Store the refresh token in an HttpOnly cookie and omit it from JSON.
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          nullable: true
          description: Required for native body transport; omitted for cookie transport.
        clientId:
          type: string
          nullable: true
          description: Registered public client id; required for cookie transport.
        audience:
          type: array
          items: { type: string }
          default: []
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          nullable: true
          description: Required for native body transport; omitted for cookie transport.
        clientId:
          type: string
          nullable: true
          description: Registered public client id; required for cookie transport.
        allDevices: { type: boolean, default: false }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, format: password }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password }
    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    UpdateProfileRequest:
      type: object
      properties:
        fullName: { type: string, nullable: true }
        photoUrl: { type: string, nullable: true }
        phoneNumber: { type: string, nullable: true }
        dateOfBirth:
          type: string
          format: date
          nullable: true
          example: "1995-06-27"
        clearPhone: { type: boolean, default: false }
    ClientCredentialsRequest:
      type: object
      required: [clientId, clientSecret]
      properties:
        clientId: { type: string }
        clientSecret: { type: string, format: password }
        scopes:
          type: array
          items: { type: string }
          default: []
        audience:
          type: array
          items: { type: string }
          default: []
    AuthorizationCodeExchangeRequest:
      type: object
      required: [clientId, code, redirectUri, codeVerifier]
      properties:
        clientId: { type: string, description: Registered public OAuth client id. }
        code: { type: string, description: One-time authorization code returned to the callback. }
        redirectUri: { type: string, format: uri, description: Exact redirect URI used to begin authorization. }
        codeVerifier: { type: string, description: Original PKCE verifier for the S256 code challenge. }
    AssignRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, example: ADMIN }

    # ---- Responses ----------------------------------------------------
    TokenResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string, nullable: true }
        tokenType: { type: string, example: Bearer }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshTokenExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: Omitted when refresh-token cookie transport is used.
    UserResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        username: { type: string }
        status: { type: string, example: ACTIVE }
        emailVerified: { type: boolean }
        fullName: { type: string, nullable: true }
        photoUrl: { type: string, nullable: true }
        phoneNumber: { type: string, nullable: true }
        phoneVerified: { type: boolean }
        dateOfBirth: { type: string, format: date, nullable: true }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ---- Envelopes ----------------------------------------------------
    ApiError:
      type: object
      nullable: true
      properties:
        code: { type: string }
        details: { type: string, nullable: true }
    TokenEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data: { $ref: "#/components/schemas/TokenResponse" }
        error: { $ref: "#/components/schemas/ApiError" }
    UserEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data: { $ref: "#/components/schemas/UserResponse" }
        error: { $ref: "#/components/schemas/ApiError" }
    RegisterEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data:
          type: object
          properties:
            user: { $ref: "#/components/schemas/UserResponse" }
            message: { type: string }
        error: { $ref: "#/components/schemas/ApiError" }
    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        data: { nullable: true }
        error: { $ref: "#/components/schemas/ApiError" }
